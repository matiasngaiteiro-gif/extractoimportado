name: fetch-mockups
on:
  push:
    branches: [brand-assets]
    paths: [brand/mockups.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar mockups
        run: |
          mkdir -p brand/mockups
          pip install --quiet pillow
          : > brand/mockups/log.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -A "Mozilla/5.0" -o "/tmp/$name.png" -w "%{http_code}" "$url" || echo ERR)
            echo "$name $code" >> brand/mockups/log.txt
            python3 -c "from PIL import Image;im=Image.open('/tmp/$name.png').convert('RGB');im.thumbnail((1920,1920));im.save('brand/mockups/$name.jpg',quality=84,optimize=True)" >> brand/mockups/log.txt 2>&1 || echo "$name convert-fail" >> brand/mockups/log.txt
          done < brand/mockups.txt
          ls -la brand/mockups
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add brand/mockups
          git commit -m "Mockups de marca (Magnific)" || exit 0
          git push
